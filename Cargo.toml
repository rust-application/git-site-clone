[package]
name = "git-site-clone"
version = "1.2.0"
authors = ["Alexander Korolev <alexander.korolev.germany@gmail.com>"]
edition = "2024"
categories = []
description = """
Clone git repositories from URLs or clipboard to a configured base directory. 
Organizes repos by hostname (github.com/, gitlab.com/, etc.) with host-based 
mappings. Includes shell integration for quick access.
"""
homepage = "https://github.com/rust-application/git-site-clone"
keywords = []
license = "Unlicense OR MIT"
repository = "https://github.com/rust-application/git-site-clone"
rust-version = "1.90.0"

[features]
default = ["clipboard"]
clipboard = ["dep:arboard"]
self-update = ["dep:reqwest", "dep:serde_json"]

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = [
    "wayland-data-control",
], optional = true }
confy = "2"
dirs = "5"
git-url-parse = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }
xflags = "0.3.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
